version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: arena-bet-db
    environment:
      POSTGRES_USER: ${DB_USER:-arena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arena_secret}
      POSTGRES_DB: ${DB_NAME:-arena_bet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arena} -d ${DB_NAME:-arena_bet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena-bet-app
    environment:
      DATABASE_URL: postgresql://${DB_USER:-arena}:${DB_PASSWORD:-arena_secret}@db:5432/${DB_NAME:-arena_bet}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: